[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genmodel-agent"
version = "0.1.0"
description = "Objective-aware dataset inspection for a generative modeling agent"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2", "anndata>=0.10,<0.13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
monitoring = ["psutil>=5.9,<8"]
training = ["torch>=2.6,<3", "matplotlib>=3.9,<4", "scikit-learn>=1.5,<2", "psutil>=5.9,<8"]

[project.scripts]
genmodel-profile = "genmodel_agent.cli:main"
genmodel-plan = "genmodel_agent.planning:main"
genmodel-execute = "genmodel_agent.execution:main"
genmodel-evaluate = "genmodel_agent.evaluation:main"
genmodel-run = "genmodel_agent.pipeline:main"

[tool.setuptools.packages.find]
include = ["genmodel_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
